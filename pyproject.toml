[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial_calibration_benchmark"
version = "1.0.0"
description = "Benchmarking confidence calibration of spatial transcriptomics deconvolution models"
dependencies = [
    "scanpy",
    "scvi-tools",
    "numpy",
    "pandas",
    "matplotlib",
    "netcal",
    "scikit-learn",
    "scipy",
    "torch",
    "pytorch-lightning"
]
